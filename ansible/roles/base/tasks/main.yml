---
- name: Install base packages
  ansible.builtin.apt:
    name: [curl, ca-certificates, ufw]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Authorize the admin user's SSH keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_public_keys }}"

- name: Refuse to harden SSH when no key is configured
  ansible.builtin.assert:
    that: admin_ssh_public_keys | length > 0
    fail_msg: >-
      Turning off password logins without an authorized key would lock you out.
      Add your public key to vault_admin_ssh_public_keys first.
  when: ssh_harden

- name: Turn off SSH password and root logins
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_harden
  notify: Restart ssh

- name: Firewall, deny incoming by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Firewall, allow outgoing by default
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Firewall, allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports }}"

- name: Firewall, allow the K3s pod and service networks
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop: "{{ ufw_cluster_cidrs }}"

- name: Firewall, enable
  community.general.ufw:
    state: enabled
