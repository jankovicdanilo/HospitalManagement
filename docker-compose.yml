services:
  db:
    container_name: hospitalmanagement-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  hospitalmanagement:
    container_name: hospitalmanagement
    build:
      context: .
      dockerfile: HospitalManagement/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__HospitalDb: "Server=db;Database=HospitalManagement;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    volumes:
      - ./logs/api:/app/logs
    depends_on:
      db:
        condition: service_healthy

  auth:
    container_name: hospitalmanagement-auth
    build:
      context: .
      dockerfile: HospitalManagement.Auth/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__AuthDb: "Server=db;Database=HospitalManagementAuth;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    volumes:
      - ./logs/auth:/app/logs
    depends_on:
      db:
        condition: service_healthy

  appointments:
    container_name: hospitalmanagement-appointments
    build:
      context: .
      dockerfile: HospitalManagement.Appointments/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__AppointmentDb: "Server=db;Database=HospitalManagementAppointments;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: "60"
      QueryService__BaseUrl: ${QUERY_SERVICE_URL}
    volumes:
      - ./logs/appointments:/app/logs
    depends_on:
      db:
        condition: service_healthy
      queryservice:
        condition: service_started

  command:
    container_name: hospitalmanagement-command
    build:
      context: .
      dockerfile: HospitalManagement.CommandService/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__CommandDb: "Server=db;Database=HospitalManagementCommand;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
    volumes:
      - ./logs/command:/app/logs
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queryservice:
    container_name: hospitalmanagement-query
    build:
      context: .
      dockerfile: HospitalManagement.QueryService/Dockerfile
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__QueryDb: "Server=db;Database=HospitalManagementQuery;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      AppointmentService__BaseUrl: ${APPOINTMENT_SERVICE_URL}
    volumes:
      - ./logs/query:/app/logs
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    container_name: hospitalmanagement-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sqldata:
  rabbitmqdata: