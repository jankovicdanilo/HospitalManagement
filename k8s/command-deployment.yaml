apiVersion: apps/v1
kind: Deployment
metadata:
  name: command
  namespace: hms-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command
  template:
    metadata:
      labels:
        app: command
    spec:
      containers:
        - name: command
          image: hospitalmanagement-command:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hms-secrets
                  key: DB_PASSWORD
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__HospitalManagementCQRS
              value: "Server=db;Database=HospitalManagementCQRS;User Id=sa;Password=$(DB_PASSWORD);TrustServerCertificate=True"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: hms-secrets
                  key: JWT_KEY
            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: hms-secrets
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: hms-secrets
                  key: JWT_AUDIENCE
            - name: Redis__ConnectionString
              value: "redis:6379"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: command
  namespace: hms-dev
spec:
  selector:
    app: command
  ports:
    - port: 8080
      targetPort: 8080
