{{- $traefik := eq .Values.ingress.className "traefik" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hms-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    {{- if $traefik }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.namespace }}-hms-strip-prefix@kubernetescrd
    {{- else }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if $svc.ingressPath }}
          - path: /{{ $svc.ingressPath }}{{ if not $traefik }}(/|$)(.*){{ end }}
            pathType: {{ if $traefik }}Prefix{{ else }}ImplementationSpecific{{ end }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}